name: Aula Manager - comprobación visual
on:
  push:
    branches: ["feat/aula-manager-portable"]
    paths:
      - "AulaManagerPortable/src/**"
      - ".github/workflows/aula-manager-visual.yml"
  workflow_dispatch:
jobs:
  visual:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Compilar ejecutable Win32 Release
        run: msbuild AulaManagerPortable\AulaManagerPortable.sln /m /p:Configuration=Release /p:Platform=Win32 /verbosity:minimal
      - name: Capturar ventana redimensionada
        shell: pwsh
        continue-on-error: true
        run: |
          Add-Type -AssemblyName System.Drawing
          Add-Type -Namespace Aula -Name Native -MemberDefinition @'
          [System.Runtime.InteropServices.DllImport("user32.dll")]
          public static extern bool MoveWindow(System.IntPtr hwnd,int x,int y,int w,int h,bool repaint);
          [System.Runtime.InteropServices.DllImport("user32.dll")]
          public static extern bool PrintWindow(System.IntPtr hwnd,System.IntPtr hdc,uint flags);
          '@
          $exe = Join-Path $PWD 'AulaManagerPortable\build\Release\AulaManagerPortable.exe'
          $proc = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 3
            $proc.Refresh()
            if ($proc.MainWindowHandle -eq [IntPtr]::Zero) {throw "Ventana no disponible"}
            New-Item -ItemType Directory -Force -Path screenshots | Out-Null
            foreach ($pair in @(@(1280,800),@(1600,900),@(1920,1080))) {
              $width = [int]$pair[0]; $height = [int]$pair[1]
              [Aula.Native]::MoveWindow($proc.MainWindowHandle,0,0,$width,$height,$true) | Out-Null
              Start-Sleep -Milliseconds 650
              $bmp = New-Object System.Drawing.Bitmap($width,$height)
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              try {
                $dc = $g.GetHdc()
                try {
                  $ok = [Aula.Native]::PrintWindow($proc.MainWindowHandle,$dc,0)
                } finally {
                  $g.ReleaseHdc($dc)
                }
                if (!$ok) {throw "PrintWindow failed"}
                $bmp.Save("screenshots/aula-$width-x-$height.png",[System.Drawing.Imaging.ImageFormat]::Png)
              } finally {
                $g.Dispose()
                $bmp.Dispose()
              }
            }
          } finally {
            if (!$proc.HasExited) {Stop-Process -Id $proc.Id -Force}
          }
      - name: Guardar capturas (si están disponibles)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AulaManager-Visual-Review
          path: screenshots/*.png
          if-no-files-found: ignore
