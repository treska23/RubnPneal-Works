name: Compilar Valenbisi Navigator APK
on:
  push:
    branches: [valenbisi-navigator-apk-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Instalar SDK
        run: |
          echo "Android SDK: $ANDROID_HOME"
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compilar APK instalable
        run: gradle -p valenbisi-navigator :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ValenbisiNavigator-instalable-APK
          path: valenbisi-navigator/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
